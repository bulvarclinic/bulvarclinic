<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinik Yönetim Sistemi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex overflow-hidden">

    <!-- Sol Menü -->
    <aside class="w-16 bg-white border-r border-slate-200 flex flex-col items-center py-4 justify-between z-20 shadow-sm">
        <div class="flex flex-col items-center gap-6">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-lg shadow-md cursor-pointer">
                <i class="fa-solid fa-tooth"></i>
            </div>
            <!-- Menü Butonları -->
            <nav class="flex flex-col gap-3">
                <button onclick="switchTab('takvim-sec')" id="btn-takvim" class="nav-btn w-10 h-10 rounded-xl flex items-center justify-center text-blue-600 bg-blue-50 transition" title="Takvim">
                    <i class="fa-solid fa-calendar-days"></i>
                </button>
                <button onclick="switchTab('hastalar-sec')" id="btn-hastalar" class="nav-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition" title="Hastalar & Loglar">
                    <i class="fa-solid fa-users text-lg"></i>
                </button>
            </nav>
        </div>
        <div class="w-9 h-9 rounded-full bg-slate-300 overflow-hidden border border-slate-300">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profil" class="w-full h-full object-cover">
        </div>
    </aside>

    <!-- Ana Alan -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Üst Bar -->
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-slate-800">Bulvar Clinic</h1>
                
                <!-- Hafta Değiştirme Butonları (Sadece Takvimde Görünür) -->
                <div id="hafta-kontrolleri" class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg border border-slate-200 text-sm">
                    <button onclick="changeWeek(-1)" class="px-2.5 py-1 rounded bg-white hover:bg-slate-50 text-slate-700 shadow-sm transition">
                        <i class="fa-solid fa-chevron-left text-xs"></i> Önceki Hafta
                    </button>
                    <span id="hafta-etiket" class="px-3 font-semibold text-slate-700 text-xs"></span>
                    <button onclick="changeWeek(1)" class="px-2.5 py-1 rounded bg-white hover:bg-slate-50 text-slate-700 shadow-sm transition">
                        Sonraki Hafta <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="openModal('randevu-modal')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-plus text-xs"></i> Randevu Ekle
                </button>
                <button onclick="openModal('hasta-modal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-user-plus text-xs"></i> Hasta Kaydet
                </button>
            </div>
        </header>

        <!-- 1. SEKMELER: HAFTALIK TAKVİM -->
        <main id="takvim-sec" class="flex-1 flex flex-col bg-white overflow-hidden">
            <!-- Gün Başlıkları -->
            <div class="grid grid-cols-8 border-b border-slate-200 bg-slate-50 text-center font-semibold text-sm text-slate-700 py-3 shadow-xs">
                <div class="border-r border-slate-200 text-slate-400 font-normal">Saat</div>
                <div class="border-r border-slate-200" id="gun-0">Pzt</div>
                <div class="border-r border-slate-200" id="gun-1">Sal</div>
                <div class="border-r border-slate-200" id="gun-2">Çar</div>
                <div class="border-r border-slate-200" id="gun-3">Per</div>
                <div class="border-r border-slate-200" id="gun-4">Cum</div>
                <div class="border-r border-slate-200" id="gun-5">Cmt</div>
                <div id="gun-6">Paz</div>
            </div>

            <!-- Saatler (08:00 - 19:00) -->
            <div id="takvim-body" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
        </main>

        <!-- 2. SEKMELER: HASTA KAYITLARI & LOGLARI -->
        <main id="hastalar-sec" class="flex-1 bg-slate-50 p-6 overflow-y-auto hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Hasta Kayıtları ve Geliş Logları</h2>
                    <p class="text-xs text-slate-500">Kayıtlı hastaların dosya numaraları, telefon ve geliş sebeplerinin listesi</p>
                </div>
                <button onclick="openModal('hasta-modal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus text-xs"></i> Yeni Hasta Logu Ekle
                </button>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold">
                            <th class="p-4">Dosya No</th>
                            <th class="p-4">Hasta Adı Soyadı</th>
                            <th class="p-4">Telefon Numarası</th>
                            <th class="p-4">Geliş Sebebi / Log</th>
                            <th class="p-4 text-center">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="hasta-tablosu-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <!-- JS ile dolacak -->
                    </tbody>
                </table>
            </div>
        </main>

    </div>

    <!-- MODAL 1: RANDEVU OLUMŞTURMA -->
    <div id="randevu-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold text-lg text-slate-800">Randevu Oluştur</h3>
                <button onclick="closeModal('randevu-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="randevuKaydet(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Hasta Adı Soyadı</label>
                    <input type="text" id="modal-hasta" required placeholder="Örn: Ahmet Yılmaz" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Gün Seçimi</label>
                    <select id="modal-gun" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="0">Pazartesi</option>
                        <option value="1">Salı
