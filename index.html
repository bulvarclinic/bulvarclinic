<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinik Yönetim Sistemi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex overflow-hidden">

    <!-- Sol Menü (Sidebar) -->
    <aside class="w-20 bg-white border-r border-slate-200 flex flex-col items-center py-4 justify-between z-20 shadow-sm">
        <div class="flex flex-col items-center gap-6">
            <!-- Logo -->
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl shadow-md cursor-pointer hover:bg-blue-700 transition" title="Bulvar Clinic">
                <i class="fa-solid fa-tooth"></i>
            </div>
            
            <!-- Ana Menü Butonları -->
            <nav class="flex flex-col gap-3">
                <button onclick="switchTab(this, 'takvim-tab')" class="nav-btn active-tab w-12 h-12 rounded-xl flex items-center justify-center text-blue-600 bg-blue-50 transition" title="Randevu Takvimi">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </button>
                <button onclick="switchTab(this, 'hastalar-tab')" class="nav-btn w-12 h-12 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition" title="Hasta Listesi">
                    <i class="fa-solid fa-user-group text-lg"></i>
                </button>
                <button onclick="switchTab(this, 'finans-tab')" class="nav-btn w-12 h-12 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition" title="Kasa ve Finans">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                </button>
                <button onclick="switchTab(this, 'gorevler-tab')" class="nav-btn w-12 h-12 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition" title="Görevler">
                    <i class="fa-solid fa-square-check text-lg"></i>
                </button>
            </nav>
        </div>

        <!-- Alt Araçlar -->
        <div class="flex flex-col items-center gap-4">
            <button onclick="showToast('Bildirimler güncel')" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 transition relative">
                <i class="fa-regular fa-bell text-lg"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
            <button onclick="openModal('yeni-hasta-modal')" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 transition" title="Hızlı Hasta Ekle">
                <i class="fa-solid fa-user-plus text-lg"></i>
            </button>
            <div class="w-10 h-10 rounded-full bg-slate-300 overflow-hidden cursor-pointer border border-slate-300" title="Profil">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profil" class="w-full h-full object-cover">
            </div>
        </div>
    </aside>

    <!-- Ana Ekran Alanı -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Üst Bar (Header) -->
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-10 shadow-sm">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-semibold text-slate-800">Bulvar Clinic <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-semibold ml-2">Yönetim Paneli</span></h1>
            </div>

            <div class="flex items-center gap-4">
                <!-- Tarih Göstergesi -->
                <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 gap-2 text-sm text-slate-700">
                    <i class="fa-regular fa-calendar text-slate-400"></i>
                    <span id="bugun-tarih"></span>
                </div>

                <!-- Hızlı Arama -->
                <div class="relative">
                    <input type="text" id="arama-input" onkeyup="hizliArama()" placeholder="Hasta veya randevu ara..." class="bg-slate-50 border border-slate-200 text-sm rounded-lg pl-9 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 w-56">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                </div>

                <!-- Yeni Randevu Ekle Butonu -->
                <button onclick="openModal('yeni-randevu-modal')" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-plus text-xs"></i> Randevu Ekle
                </button>

                <!-- Görünüm Kipleri -->
                <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-sm">
                    <button onclick="changeView(this)" class="view-btn px-3 py-1 rounded-md bg-white font-medium shadow-sm">Gün</button>
                    <button onclick="changeView(this)" class="view-btn px-3 py-1 rounded-md text-slate-600 hover:text-slate-800">Hafta</button>
                    <button onclick="changeView(this)" class="view-btn px-3 py-1 rounded-md text-slate-600 hover:text-slate-80
